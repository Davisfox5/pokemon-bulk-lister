name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon-bulk-lister
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Lightweight slice of requirements.txt — enough to import the modules
        # under test. cloudinary/playwright are deliberately omitted: the
        # publish logic imports them lazily (or we stub Playwright in conftest),
        # so CI stays fast and doesn't pull a browser. OpenCV (headless build)
        # is needed by the art-match tests; SQLAlchemy backs the
        # library/marketplace/deck tests.
        run: >-
          pip install requests "Flask>=3.0" python-dotenv "pandas>=2.2"
          "SQLAlchemy>=2.0" opencv-python-headless pytest

      - name: Byte-compile all sources
        run: python -m compileall -q lib webapp scripts

      - name: Run tests
        run: pytest -q
