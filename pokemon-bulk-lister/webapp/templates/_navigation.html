<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <a class="site-brand" href="/" aria-label="Pokémon bulk lister home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><rect x="6" y="5" width="18" height="24" rx="3" transform="rotate(-12 6 5)" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="4" width="17" height="23" rx="3" fill="currentColor"/><path d="M16 15.5h9m-4.5-4.5v9" stroke="var(--brand-mark-ink, #203b32)" stroke-width="1.5"/></svg>
    </span>
    <span class="brand-copy"><span class="brand-title">Pokémon</span><span class="brand-subtitle">bulk lister</span></span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    {% for path, label, icon in [('/', 'Scan', 'scan'), ('/portfolio', 'Library', 'library'), ('/decks', 'Decks', 'decks'), ('/market', 'Marketplace', 'market')] %}
    <a class="nav-link{% if request.path == path %} active{% endif %}" href="{{ path }}"{% if request.path == path %} aria-current="page"{% endif %}>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        {% if icon == 'scan' %}<path d="M6 2H3a1 1 0 0 0-1 1v3m12-4h3a1 1 0 0 1 1 1v3M2 14v3a1 1 0 0 0 1 1h3m12-4v3a1 1 0 0 1-1 1h-3M6 7h8v6H6z"/>
        {% elif icon == 'library' %}<path d="M3 3h4v14H3zm5 0h4v14H8zm6 1 3-1 3 13-3 1z"/>
        {% elif icon == 'decks' %}<rect x="7" y="2" width="10" height="14" rx="2"/><path d="M5 5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8m-1-12h2m-2 4h2"/>
        {% else %}<path d="M2 7l2-4h12l2 4M3 8v9h14V8M2 7h16M7 17v-6h6v6"/>{% endif %}
      </svg>{{ label }}
    </a>
    {% endfor %}
  </nav>
  {% if session.get('uid') %}<a class="account-link" href="/logout">Log out</a>
  {% else %}<a class="account-link" href="/login">Log in</a>{% endif %}
</header>
