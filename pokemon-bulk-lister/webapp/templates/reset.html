<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password · Card Portfolio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Choose a new password</h1>
    <p class="auth-sub">Any other browser logged in to this account is signed out.</p>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post" action="/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password <span class="hint">(8+ characters)</span>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
      </label>
      <button type="submit" class="btn btn-primary">Save and log in</button>
    </form>
  </main>
</body>
</html>
